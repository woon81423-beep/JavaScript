<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = 5;
      switch (num) {
        case 1:
          console.log(`1입니다`);
          break;
        case 2:
          console.log(`2입니다`);
          break;
        default:
          console.log(`1, 2 숫자가 아닙니다.`);
      }
    
    </script>
  </body>
</html>
<!--
*switch

switch(변수){
case 값01 :
실행문
break
case 값02 :
실행문
break
case 값 03 :
break
default :
실행문
}
변수가 값1 하고 같으면 값1 에 있는 실행문을 실행하고 break를 만나 switch문을 빠져나감
default는 마지막에 입력하고 break를 작성하지 ㅇ낳음

if문은 true, false를 가지고 실행문을 실행함
switch는 값이 숫자, 문자인경우도 사용 가능.

-->

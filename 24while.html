<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let i = 1;
      while (i <= 5) {
        console.log(i);
        i++;
      }
      let total = 0;
      let num = 1;
      while (num <= 10) {
        total += num;
        num++;
      }
      console.log(total);

      let j = 3;
      do {
        console.log(j);
        j++;
      } while (j <= 5);
    </script>
  </body>
</html>
<!--

*while
while(조건문){
조건이 참일때 실행문
}
조건이 참일때 실행문을 실행할 수 있음

do{
실행문
}while(조건문)
실행문을 실행하고 조건을 체크함
조건이 만족하지 않아도 한번은 실행이 됨
조건을 만족하면 계속 실행이 되고
조건이 만족하지 않으면 반복문을 빠져나감
무조건 한번은 실행이됨

이 둘의 차이점은
조건이 만족하는 동안 계속해서 반복해야 할 경우에는 while문을 사용하면 됨
조건에 관계없이 무조건 한번은 실행해야 할 경우라면 do while문을 사용함
-->

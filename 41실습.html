  <body>
    <input id="user" placeholder="글자를 입력" />
    <button id="btn" onclick="on()">클릭</button>

      let on = () => {
        let gg = user.value;
        if (gg == "") {
          alert("글자를 입력해주세요");
        } else {
          alert(`${gg}을 입력하셨습니다.`);
        }
      };
      user.onfocus = () => {
        user.value = "";
      };
    </script>

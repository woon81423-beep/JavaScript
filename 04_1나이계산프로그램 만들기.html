<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let current = 2026;
      let birthday;
      let age;

      birthday = prompt("태어난 연도를 입력하세요.(YYYY)");
      age = current - birthday + 1;
      document.write(`${current} 년 현재<br> `);
      document.write(`${birthday} 년에 태어난 사람의 나이는 ${age} 세입니다.`);

    </script>
  </body>
</html>

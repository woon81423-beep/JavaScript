<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = ["a", "b", "c"];
      let arr02 = [1, 3, 5, 7, 2];

      arr.push("d"); //맨 뒤에 데이터 추가
      console.log(arr);

      arr.pop(); //맨 뒤에있는 데이터 삭제
      console.log(arr);

      console.log(arr02.sort()); //자동정렬

      console.log(arr02.includes(2)); //데이터찾기
      console.log(arr02.includes(12)); //데이터찾기

      //slice는 배열 만들기 slice(시작자리수 , 마지막 -1 자리수)
      let arr03 = arr.slice(0, 2);
      console.log(arr03);
      //arr이라는 배열에서 0부터 2자리 전까지를 빼서 가져와
      console.log(arr);
      console.log(arr03.pop());
      console.log(arr);
      console.log(arr03);
    </script>
  </body>
</html>

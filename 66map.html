<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = [1, 2, 3];
      let result = [];
      num.forEach((item) => {
        result.push(item * 2);
      });
      //   console.log(result);
      //forEach문에 index를 이용하는 방법
      let num2 = [1, 2, 3, 4];
      let result2 = [];
      num2.forEach((item, index) => {
        // console.log(item, index);
        result2[index] = item * 2;
      });
      //   console.log(result2);

      //map
      const numbers = [1, 2, 3, 4];
      let numbers2 = numbers.map((num) => {
        console.log(num);
        return num * 2;
      });
      console.log(numbers2);
    </script>
  </body>
</html>
<!--
map()는 배열의 요소를 하나씩 꺼내서 새로운 배열을 만들어줌

원본 배열은 바뀌지 않고

결과를 새로운 배열로 만들어줌

​

배열map((하나씩 받는 변수, 인덱스)=> {

return반환값

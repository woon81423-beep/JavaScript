<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let sub = [
        { name: "홍길동", age: 30 },
        { name: "mbs", age: 10 },
      ];
      //중괄호, return을 이용한 정석버전
      let user = sub.map((item) => {
        // console.log(item);
        // console.log(sub);
        console.log(item.name);
        return item.name;
      });
      console.log(user);

      let num = sub.map((item) => {
        console.log(item.age);
        return item.age;
      });
      console.log(num);

      //실행문이 하나면 중괄호와 return생략가능
      let user2 = sub.map((item) => item.age);
      console.log(user2);
    </script>
  </body>
</html>
<!--
배열map((하나씩 받는 변수, 인덱스)=> {
return반환값
}
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button>멈춤</button>
    <div></div>
    <script>
      let stop = document.querySelector("button");
      let txt = document.querySelector("div");
      let i = 0;
      let start = () => {
        i++;
        txt.innerText = `${i}`;
      };
      let btn = setInterval(start, 1000);

      stop.addEventListener("click", () => {
        clearInterval(btn);
      });

    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="game">
      <h3 class="game-title">숫자를 맞춰서 <span>홈런</span>을 치자!</h3>

      <div id="pic">
        <video
          id="imgg"
          src="image/ready.mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>
        <div id="imggg">READY!</div>
      </div>

      <div class="scoreboard">
        <div id="result">1부터 100까지의 숫자를 맞혀 보세요!</div>
        <div id="chance">남은 찬스 · 5번</div>
      </div>

      <div class="game-controls">
        <input
          id="user"
          placeholder="1부터 100까지"
          onkeydown="if (event.key === 'Enter' && !event.repeat) play();"
        />
        <button id="play" type="button">START</button>
        <button id="reset" type="button">REPLAY</button>
      </div>
    </main>

    <script src="custom.js"></script>
  </body>
</html>
<!--
제작순서
html요소 가지고 오기(img, result, chance, user, play, reset)
1부터 100까지 랜덤한 수 만들기(randomNum)
play라는 함수를 만들어서 사용자가 입력한 값을 가지고 옴(시작버튼, enter)
play함수안에 사용자가 입력한 수 와 컴퓨터가 만든 수를 비교, up/down/bingo가 나오게 함, 이미지도 변경
user 포커스하면 기존숫자 삭제
숫자를 입력하고 enter을 누르면 play 함수를 호출
chance를 1씩 감소시키고 남은 찬스 몇개라고 출력, chances가 1보다 작으면 시작버튼이 비활성화. chance 자리에 gameover라는 글자 출력, 입력창도비활성화
재시작을 클릭하면 처음화면으로 돌아감
**같은숫자를 입력하면 입력되었던 숫자입니다 라고 뜨고 chance가 감소되지 않음
-->

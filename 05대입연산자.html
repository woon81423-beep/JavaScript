<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 5
        document.write(`num은 ${num}<br>`)
        document.write(`num변수에 3을 더해서 num변수에 넣음 ${num += 3}<br>`)
        document.write(`num변수에 3을 빼서 num변수에 넣음 ${num -= 3}<br>`)
        document.write(`num변수에 3을 곱해서 num변수에 넣음 ${num *= 3}<br>`)
        document.write(`num변수에 3을 나눠서 num변수에 넣음 ${num /= 3}<br>`)
        document.write(`num변수에 3을 나눈 나머지를 num변수에 넣음 ${num %= 3}<br>`)
      
    </script>
</body>
</html>
<!--

*대입연산자
대입연산자는 연산을 한 후에 변수에 넣는다 라는 의미
total +=1 ==> tatal = tatal + 1
산술연산이 먼저 나와야 함

num -= 1 ==>num = num - 1
num *= 1 ==>num = num * 1
num /= 1 ==>num = num / 1
num %= 1 ==>num = num % 1

-->

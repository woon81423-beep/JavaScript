<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>숫자 맞추기 게임</h3>
    <div>결과화면 : <span id="result">up/down/bingo</span></div>
    <div>
        <span>숫자입력</span>
        <input id="user" placeholder="1부터 100까지의 수" />
        <button id="play" >시작</button>
    </div>
    <script src="js/custom.js"></script>

</body>
</html>
<!--
console.log(Math.floor(num * 100 + 1));
참고 37,41,65,60,12,40

html요소 가져오기
1~100까지 숫자만들기(random)
user에 숫자를 입력하고 play버튼을 클릭하면 입력한 값을 변수에 담아야 함(.value)
user가 입력한 수와 컴퓨터가 random으로 만든 수를 비교 
com > user ==> up // com < user => down // com = user =>bingo

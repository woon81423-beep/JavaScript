<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let result = 2 < 3;
        let result2 = 30 > 50;

        document.write(`result는 2 < 3 <br>`)
        document.write(`result2는 30 > 50 <br><br>`)
        document.write(`result의 결과값은 ${result}<br>`)
        document.write(`result2의 결과값은 ${result2}<br>`)
        document.write(`result 그리고 result2의 결과값은 ${result && result2}<br>`)
        document.write(`result 또는 result2의 결과값은 ${result || result2}<br>`)
        document.write(`result의 반대 결과값은 ${!result}<br>`)
        document.write(`result2의 반대 결과값은 ${!result2}`)
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = [10, 20, 30];
      console.log(num.length);
      //   console.log(num[0]); //0번째 자리에 있는 값을 출력
      //   console.log(num[1]); //첫번째 자리에 있는 값을 출력
      //   console.log(num[2]);

      for (i = 0; i <= 2; i++) {
        console.log(num[i]);
      }
      for (i = 0; i <= num.length - 1; i++) {
        console.log(num[i]);
      }
      for (i = 0; i < num.length; i++) {
        console.log(num[i]);
      }
    </script>
  </body>
</html>

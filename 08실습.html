<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
        
        //문제1
      let inch = prompt(`인치를 입력하세요`);
      console.log(`인치를 센티로 변환 ${inch * 2.54}`);
      //문제2
     
      let p = prompt(`평수를 입력하세요`);
      console.log(`평수를 제곱미터로 변환 ${p * 3.305}`);
      //문제3
   
      let s = prompt(`섭씨를 입력하세요`);
      console.log(`섭씨를 화씨로 바꾸면 ${s * 1.5 + 32}`);
      //문제4
   
      let num01 = Number(prompt(`점수를 입력하세요1`));
      let num02 = Number(prompt(`점수를 입력하세요2`));
      console.log(`평균은 ${(num01 + num02) / 2}`);
      //문제5
      let start = 2026;
      let br;
      let age;
      br = prompt(`태어난 년도는?`);
      age = start - br + 1;
      console.log(`나이는 ${age}`);
    </script>
  </body>
</html>
<!--
문제1. 인치를 입력받아서 센티미터로 변환
1인치는 2.54센티미터

문제2. 평수를 입력받아서 제곱미터로 변환
1평은 3.305제곱미터

문제3. 섭씨를 입력받아서 화씨로 변환
화씨 = 섭씨 * 1.8 + 32

문제4. 두 수를 입력받아서 평균을 구하시오

문제5. 태어난 년도를 입력받아서 나이를 계산하시오

-->

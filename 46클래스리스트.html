<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 200px;
        height: 200px;
        border: 1px solid #ccc;
      }
      .on {
        background-color: orange;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div>스타일</div>
    <button id="btn01">추가</button>
    <button id="btn02">삭제</button>
    <button id="btn03">토글</button>

    <script>
      let div = document.querySelector("div");
      let btn01 = document.querySelector("#btn01");
      let btn02 = document.querySelector("#btn02");
      let btn03 = document.querySelector("#btn03");
    

      btn01.addEventListener("click", () => {
        div.classList.add("on");
      });
      btn02.addEventListener("click", () => {
        div.classList.remove("on");
      });
      btn03.addEventListener("click", () => {
        div.classList.toggle("on");
      });
    </script>
  </body>
</html>
<!--
*classList:
클래스를 추가하거나 삭제하면서 여러가지 스타일 효과를 지정할 수 있음.
추가할 스타일은 css에 미리 만들어져 있어야함
제이쿼리에서 addClass, removeClass, toggleClass와 같은 개념

<형식>
선택자.classList.add("클래스명") ==> addClass
선택자.classList.remove("클래스명") ==> removeClass
선택자.classList.togle("클래스명") ==> toggleClass


-->

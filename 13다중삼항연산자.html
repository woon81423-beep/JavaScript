<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let score = prompt("당신의 점수를 입력하세요");
      let result = score >= 90 ? `참 잘함` 
      : score >= 70 ? `잘함`
      : `보통입니다.`;
      document.write(`당신의 점수는 ${score}이며 ${result}`);
    </script>
  </body>
</html>

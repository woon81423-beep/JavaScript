<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num01 = 10;
        let num02 = 3;
        document.write(`두 수의 덧셈은 ${num01 + num02} 입니다.<br>`)
        document.write(`두 수의 뺄셈은 ${num01 - num02} 입니다.<br>`)
        document.write(`두 수의 곱셈은 ${num01 * num02} 입니다.<br>`)
        document.write(`두 수의 나눗셈은 ${num01 / num02} 입니다.<br>`)
        document.write(`두 수를 나눈 나머지는 ${num01 % num02} 입니다.`)
    </script>
</body>
</html>

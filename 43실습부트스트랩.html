<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      body {
        text-align: center;
        padding-top: 450px;
        font-size: 1.2rem;
      }
     .modal-body{
      text-align: left;
     
     }
      .modal-title {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="form-floating mb-3 mt-3">
      <input
        type="text"
        class="form-control"
        id="id"
        placeholder="Enter email"
        name="email"
      />
      <label for="email">Id</label>
    </div>

    <div class="form-floating mt-3 mb-3">
      <input
        type="password"
        class="form-control"
        id="pw"
        placeholder="Enter password"
        name="pswd"
      />
      <label for="pwd">Password</label>
    </div>

    <!-- <div>아이디 : <input id="id" type="text" placeholder="아이디입력" /></div>
    <div>
      비밀번호 : <input id="pw" type="password" placeholder="비밀번호입력" />
    </div> -->
    <button id="btn" type="submit" class="btn btn-primary">전송</button>

    <!-- The Modal -->
    <div class="modal" id="myModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title"></h4>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <!-- Modal body -->
          <div class="modal-body"></div>

          <!-- Modal footer -->
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-danger"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      let id = document.querySelector("#id");
      let pw = document.querySelector("#pw");
      let btn = document.querySelector("#btn");
      let modalheader = document.querySelector(".modal-title");
      let modalBody = document.querySelector(".modal-body");

      btn.addEventListener("click", () => {
        let idValue = id.value;
        let pwValue = pw.value;

        if (id.value == "") {
          alert("아이디 입력해 주세요");
        } else if (pw.value == "") {
          alert("비밀번호를 입력해주세요");
        } else {
          modalheader.textContent = `아이디는 ${idValue}`;
          modalBody.textContent = `패스워드는 ${pwValue}`;
          let modal = bootstrap.Modal.getOrCreateInstance(
            document.querySelector("#myModal"),
          );
          modal.show();
        }
      });
      id.addEventListener("focus", () => {
        id.value = "";
      });
      pw.addEventListener("focus", () => {
        pw.value = "";
      });
    </script>
  </body>
</html>

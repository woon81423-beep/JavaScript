<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      .wrap01 {
        width: 300px;
        height: 300px;
        position: relative;
        /* border: 1px solid red; */
        margin: 0px auto;
      }

      .wrap01 li {
        position: absolute;
        top: 0%;
        left: 0%;
        width: 100%;
        height: 100%;
        display: none;
      }
      .wrap01 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wrap02 {
        display: flex;
        justify-content: center;
        gap: 10px;
        width: 80%;
        margin: 10px auto;
        /* display: none; */
      }
      .wrap02 li {
        width: 100px;
        cursor: pointer;
      }
      .wrap02 img {
        width: 100%;
      }
      .wrap01 li.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div>
      <ul class="wrap01">
        <li><img class="on" src="img/pic1.jpg" alt="주점" /></li>
        <li><img src="img/pic2.jpg" alt="주점" /></li>
        <li><img src="img/pic3.jpg" alt="주점" /></li>
        <li><img src="img/pic4.jpg" alt="주점" /></li>
      </ul>
      <ul class="wrap02">
        <li class="on"><img src="img/pic1.jpg" alt="주점" /></li>
        <li><img src="img/pic2.jpg" alt="주점" /></li>
        <li><img src="img/pic3.jpg" alt="주점" /></li>
        <li><img src="img/pic4.jpg" alt="주점" /></li>
      </ul>
    </div>
    <script>
      let small = document.querySelectorAll(".wrap02 li");
      let pop = document.querySelectorAll(".wrap01 li");
      
      console.log(pop);

      small.forEach((list, index) => {
        list.addEventListener("click", () => {
          // console.log(index);
          pop.forEach((item)=>{
            item.classList.remove("on");
            console.log(item)
          })
          pop[index].classList.add("on");
        });
      });
    </script>
  </body>
</html>
<!--
wrap02 li 중에 첫번째 클릭하면
wrap01 li 중에 첫번째 보이게 해라

wrap02 li 중에 두번째 클릭하면
wrap01 li 중에 두번째 보이게 해라

wrap02 li 중에 세번째 클릭하면
wrap01 li 중에 세번째 보이게 해라

wrap02 li 중에 네번째 클릭하면
wrap01 li 중에 네번째 보이게 해라



-->

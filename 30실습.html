<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let jumsu = [100, 50, 60, 80];
      console.log(jumsu.length)
      
      for (let i = 0; i < jumsu.length; i++) {
        if (jumsu[i] >= 60) {
          console.log(jumsu[i]);
        }
      }
      for (let item of jumsu) {
        // console.log(`여기${item}`);
        if (item >= 60) {
          console.log(item);
        }
      }
      jumsu.forEach(function (item) {
        if (item >= 60) {
          console.log(item);
        }
      });
    </script>
  </body>
</html>
<!--
점수가 60점 이상인 값만 반복문으로 출력
반복문 for,forof,forEach사용
if문 사용
-->

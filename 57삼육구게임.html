<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      for (let i = 1; i < 9; i++) {
        // console.log(typeof i);
        let str = i.toString();
        // console.log(typeof str);
        let result = `${i}`;
        if (str == "3" || str == "6" || str == "9") {
          // console.log("박수")
          result = "✋";
        }
        document.write(`${result}<br>`);
      }
    </script>
  </body>

비동기식:: 앞에서 작업이 끝나지 않았더라도 계속 요청을 받음
시간이 걸리지 않는 것을 먼저 처리해줌
시간이 걸리는 것은 나중에 처리

acync function weather( ){
let response = await fetch("서버주소") 해당 서버주소에 정보를 요청을 함
let data = await response.json( ) response에 담긴 정보는 객체형태로 만들어줌(서버 관련 정보)
}

await 가 있으면 함수 앞에 async를 넣어줘야 함

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    
    <button id="btn01" onclick="weather('seoul')">서울</button>
    <button id="btn02" onclick="weather('busan')">부산</button>
    <button id="btn03" onclick="weather('incheon')">인천</button>
    <button id="btn04" onclick="weather('jeju city')">제주</button>

    <div><span>기온</span> <span id="temp"></span><span> ℃ </span></div>
    <div><span>위치</span> <span id="place"></span></div>
    <div><span>풍속</span> <span id="wind"></span> m/s</div>
    <div><span>날씨설명</span> <span id="des"></span></div>
    <img id="iconImg" />

    <script src="custom2.js"></script>
  </body>
</html>

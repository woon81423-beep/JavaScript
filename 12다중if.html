<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let score = prompt("점수를 입력하세요");

      if (score >= 80) {
        console.log(`참 잘함`);
      } else if (score >= 70) {
        console.log(`잘함`);
      } else {
        console.log(`보통`);
      }
    </script>
  </body>
</html>

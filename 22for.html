<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 5; i++) {
        console.log(`${i}`);
      }
    </script>
  </body>
</html>
<!--
*반복문
반복문은 같은 동작을 여러번 실행하기 위해 사용하는 구문
setInterval도 계속 반복이지만(무한반복)
for문은 종료를 알 수 있음

for (초기값 ; 조건 ; 증가또는 감소){
조건에 맞으면 실행
}
초기값은 처음 한번만 체크
조건문은 만족하면 for문을 계속 실행하고
조건문을 만족하지 않으면 for문을 빠져나감

1.초기값 - 조건 - 실행 - 증가 또는 감소
2.조건 - 실행 - 증가 또는 감소
-->

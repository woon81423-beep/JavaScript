<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
        //기본
      setInterval(function () {
        console.log("안녕");
      }, 3000);

      //화살표함수 let선언 먼저

      let hello = () => {
        console.log("안녕하세요");
      };
      setInterval(hello, 3000);

      //화살표함수
      setInterval(() => {
        console.log("안녕안녕하세요");
      }, 3000);

      //함수먼저선언
      function hi() {
        console.log("hi");
      }
      setInterval(hi, 3000);
    </script>
  </body>
</html>
<!--
*setInterval
setInterval()은 일정한 시간 간격으로 코드를 반복 실행하는 함수

형식
1.setInterval(function( ){
실행문
},밀리초)

setInterval(( )=>{
실행문
},밀리초)

2.실행문을 함수로 만들고 setInterval에서 함수를 호출함
function 함수명( ) {
실행문
}

setInterval( 함수명, 밀리초)

화살표 함수로는
변수 = ( ) => {
실행문
}
setInterval(변수명, 밀리초)

*function이랑 화살표함수랑 틀린점
1.호출을 할때 화살표함수는 함수보다 아래에서 호출을 해야함
함수를 먼저 만들고 호출을 해야함

2. 화살표함수는 this를 사용못함
-->

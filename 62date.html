<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let day = new Date();
      console.log(day);
      //   let now = Date.now();
      //   console.log(now);

      console.log(day.getFullYear()); //년도
      console.log(day.getMonth()); //월
      console.log(day.getDate()); //날짜
      console.log(day.getDay()); //요일
      console.log(day.getHours()); //시간
      console.log(day.getMinutes()); //분
      console.log(day.getSeconds()); //초

      document.write(
        `현재 시간은 ${day.getHours()} 시 ${day.getMinutes()}분입니다.<br>`,
      );

      let num = day.getDay();
      let num00;
      let num01;
      let num02;

      switch (num) {
        case 0:
          num00 = "일";
          break;
        case 1:
          num00 = "월";
          break;
        case 2:
          num00 = "화";
          break;
        case 3:
          num00 = "수";
          break;
        case 4:
          num00 = "목";
          break;
        case 5:
          num00 = "금";
          break;
        default:
          num00 = "토";
      }

      document.write(
        `오늘 날짜는 ${day.getFullYear()}년 ${day.getMonth() + 1} 월 ${day.getDate()}일 ${num00}요일 입니다. `,
      );

   
    </script>
  </body>
</html>
<!--
내장함수:자바스크립트 안에 함수를 내장한 것(alert, Number, date...)
외장함수 : 우리가 필요에 의해 함수를 만드는 것

날짜와 관련된 내장함수
Date를 활용하면 시간 및 날짜를 출력할 수 있음
Date.now() : 1970년 1월 1일 0시 0분 0초부터 현재까지 경과된 밀리초
newDate():현재 날짜와 시간을 저장
getFullYear(): 년도값을 가지고 옴
getMonth(): 월값을 가지고 옴(0~11의 숫자로 반환)
0=1월, 1=2월...
getDate():일값을 가지고 옴(1~31의 숫자로 반환)
getDay(): 요일값을 가지고 옴(0~6의 숫자로 반환)
0=일요일, 1=월요일, 2=화요일...

getHours() : 현재 시간을 반환
getminutes() : 현재 분을반환
getSeconds():현재 초를 반환
getMilliseconds():현재 밀리초를 반환

요일은 스위치문 이용(일월화수...)

-->

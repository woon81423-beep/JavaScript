<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num01 = 10;
        let num02 = 20;

        document.write(`num01이 num02보다 큽니까? ${num01 > num02}<br>`)
        document.write(`num01이 num02보다 크거나 같습니까?${num01 >= num02}<br>`)
        document.write(`num01이 num02보다 작습니까?${num01 < num02}<br>`)
        document.write(`num01이 num02보다 작거나 같습니까?${num01 <= num02}<br>`)
        document.write(`num01이 num02는 같습니까?${num01 == num02}<br>`)
        document.write(`num01이 num02는 다릅니까?${num01 != num02}`)

        let num03 = 10;
        let str = "10";
        console.log(`${num03 == str}`)
        console.log(`${num03 === str}`)
        console.log(`${num03 != str}`)
        console.log(`${num03 !== str}`)
    </script>
</body>
</html>
<!--
*비교연산자
> :: 크다
>= :: 크거나 같다
< :: 작다
<= :: 작거나 같다
== :: 같다
!= :: 같지않다
=== ::같다

비교연산자는 결과값이 true, false
-->

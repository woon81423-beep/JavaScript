<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = [1,2,3,4,5]
        let result = num.filter((i)=>{
            return i >= 3
        })
        console.log(result);

        let result02 = num.filter((i)=> i >=2)
        console.log(result02)
    </script>
</body>
</html>
<!--
*filter
filter()는 배열에서 조건에 맞는 값만 골라서 새로운 배열을 만듬

배열.filter((하나씩 받는 변수)=>{
return 조건식})
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = 7.5;
      if (num > 0) {
        if (num >= 10) {
          console.log(`숫자 ${num}은 10보다 크거나 같음`);
        } else {
          console.log(`숫자 ${num}은 0보다는 크고 10보다는 작은 수 `);
        }
      } else {
        console.log(`음수거나 0`);
      }
    </script>
  </body>
</html>

      let i = prompt("숫자입력");
      if (i >= 10) {
        document.write(`${i}는 10이상입니다`);
      } else {
        document.write(`${i}는 10미만입니다<br>`);
      }
      document.write(`<br>숫자 10이 기준`);
    </script>
  </body>

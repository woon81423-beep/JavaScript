<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //함수이름이 있는 선언적 함수

      function sum(a, b) {
        console.log(a, b);
      }
      sum(10, 20);

      //함수이름이 없는 익명함수

      let sum2 = function (a, b) {
        console.log(a, b);
      };
      sum2(30, 40);

      //화살표함수(익명)

      let sum3 = (a, b) => {
        console.log(a, b);
      };
      sum3(50, 60);
    </script>
  </body>
</html>
<!--

*화살표함수
화살표함수는 =>기호를 사용하여 function 키워드를 생략함
매개변수가 없을 경우는
( ) => {
실행문
}

매개변수가 있을 경우는 (a,b) => {
실행문
}

데이터값을 가지고 함수를 호출했을때
함수에서 받는 변수를 매개변수(a, b)라고 함

<함수 이름이 있는 선언적함수>
function sum(a, b) {
실행문
}
sum(10, 20)

<함수 이름이 없는 익명함수>(변수에 함수를 담음)
let sum = function(a,b){
실행문
}
sum(10,20)

<화살표함수>(리액트에서 사용)
let sum = (a, b) => {
실행문
}
sum(10, 20)

**함수이름이 없으면 함수의 아래에 변수의 값을 주어야함
-->

      ["봄", "여름", "가을", "겨울"].forEach(function (item, i) {

      });

      //   console.log(num.length);
      for (let nu of num2) {
        console.log(nu);
      }
      [num2].forEach(function (item, i) {

      });
      [10, 20, 30].forEach(function (item, i) {
        console.log(`${i}번째 데이터는 ${item}`);
      });

      num2.forEach(function (item) {
        console.log(`포이치${item}`);
      });

      num2.forEach((item) => {
        console.log(item);
      });

    </script>

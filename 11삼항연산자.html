<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num01 = 10;
      let num02 = 30;

      let result = num01 >= num02 ? "큽니다" : "작습니다";
      document.write(result);
    </script>
  </body>
</html>
<!--
*삼항연산자
삼항연산자는 if문 코드를 간결하고 가독성을 높이려고 사용함

삼항연산자의 형식
조건식 ? 참일때 실행 : 거짓일때 실행
조건식이 참이면 ?뒤의 첫번째를 실행
조건식이 거짓이면 ?뒤의 두번째를 실행

변수 = 조건식 ? 참일때 실행 : 거짓일때 실행
-->

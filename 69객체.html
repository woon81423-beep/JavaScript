<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body></body>
  <script>
    // const arr = [1, 2, 3];
    // console.log(arr[1]);

    const mbc = {
      name: "mbc",
      location: "화곡역",
      year: 1990
    };

    console.log(mbc);
    console.log(mbc.name);
    console.log(mbc.location);
    console.log(mbc.year);
  </script>
</html>
<!--
*객체

변수 : 하나의 값만 저장
배열 : 여러개의 값을 저장, 객체 안에 들어간 값의 형식이 보통 일정
객체 : 여러개의 값을 저장. 객체 안에 들어간 값은 형식이 틀려도 됨

객체 안에는 키(key) : 값(value)이 한쌍으로 들어가야함
객체는 한꺼번에 여러값을 담을 수 있음

mbc학원을 설명
이름 : "mbc"
위치 : "화곡역"
설립연도 : 1990

mbc = {
name : "mbc",
location : "화곡역",
year : 1990,
}

객체안에 들어간 값을 추출할 때에는 변수.키를 입력함
mbc.name
mbc.location
mbc.year

배열은[] 사용하고 배열에 들어간 값을 추출할때는 인덱스번호로 사용
arr = [1,2,3]
arr[0] => 1
arr[1] => 2
-->

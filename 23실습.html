<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let sum = 0;
      for (let i = 1; i <= 10; i++) {
        sum += i;
      }
      console.log(`${sum}`);
      let err = 0;
      for (let e = 1; e <= 10; e++) {
        if (e % 2 == 0) {
          err += e;
        }
      }
      console.log(`${err}`);
      for (let r = 2; r <= 9; r++) {
        console.log(`2 * ${r} = ${2 * r}`);
      }
    </script>
  </body>
</html>

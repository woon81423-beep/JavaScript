<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
      }
      .wrap {
        width: 100%;
        height: 100vh;
        background-color: #ff0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .wrap li {
        width: 300px;
      }
      .wrap img {
        width: 100%;
      }
      .modalBox {
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.7);
        position: absolute;
        left: 0px;
        top: 0px;
        display: none;
        justify-content: center;
        align-items: center;
      }
      .modalBox.on {
        display: flex;
      }
      .modal {
        width: 50%;
        height: 400px;
        background-color: #fff;
        position: relative;
      }
      #btn {
        position: absolute;
        right: 10px;
        top: 10px;
      }
      .modalImg {
        width: 90%;
        height: 90%;
        border: 1px solid red;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .modalImg li {
        width: 100%;
        height: 100%;
        display: none;
      }

      .modalImg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .modalImg li.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <ul class="wrap">
      <li><img src="img/pic1.jpg" alt="" /></li>
      <li><img src="img/pic2.jpg" alt="" /></li>
      <li><img src="img/pic3.jpg" alt="" /></li>
    </ul>
    <div class="modalBox">
      <div class="modal">
        <button id="btn">x</button>
        <ul class="modalImg">
          <li class="on"><img src="img/pic1.jpg" alt="" /></li>
          <li><img src="img/pic2.jpg" alt="" /></li>
          <li><img src="img/pic3.jpg" alt="" /></li>
        </ul>
      </div>
    </div>
    <script>
      //html요소 가지고 오기
      let wrap = document.querySelectorAll(".wrap li");
      let modalImg = document.querySelectorAll(".modalImg li");
      let btn = document.querySelector("#btn");
      let modalBox = document.querySelector(".modalBox ");
      console.log(modalImg);

      wrap.forEach((list, index) => {
        list.addEventListener("click", () => {
          modalBox.classList.add("on");

          modalImg.forEach((item) => {
            item.classList.remove("on");
          });
          modalImg[index].classList.add("on");
        });
      });

      btn.addEventListener("click", () => {
        modalBox.classList.remove("on");
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      #pwd {
        width: 50%;
        margin: 0px auto 20px;
      }
      #btn {
        margin: 10px auto;
        /* width:70px; */
        display: flex;
        text-align: center;
      }
      div {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 30px;
        width: 60%;
        margin: 220px auto;
      }
    </style>
  </head>
  <body>
    <div>
      <input
        type="txt"
        class="form-control"
        id="pwd"
        placeholder="글자를 입력하세요"
      />
      
      <button id="btn" type="button" class="btn btn-danger">클릭</button>
    </div>
    <script>
      let pwd = document.querySelector("#pwd");
      let btn = document.querySelector("#btn");

      btn.addEventListener("click", () => {
        let msg = pwd.value;
        if (msg == "") {
          alert(`글자를 입력해주세요`);
        } else {
          alert(`${msg}를 입력하셨습니다.`);
        }
      });

      pwd.addEventListener("focus", () => {
        pwd.value = "";
      });
      //   let on = () => {
      //     let gg = pwd.value;
      //     if (gg == "") {
      //       alert("글자를 입력해주세요");
      //     } else {
      //       alert(`${gg}을 입력하셨습니다.`);
      //     }
      //   };
      //   pwd.onfocus = () => {
      //     pwd.value = "";
      //   };
    </script>
  </body>
</html>

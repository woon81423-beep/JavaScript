<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var i = 10;
      var i = 20;
      //var은 중복값이 가능해서 문제가 됨
      let j = 10;
      j = 20;
      console.log(j);

      let num = 10;
      let Num = 25;
      console.log(num);
      console.log(Num);

      const jumin = 0;
      jumin = 10;
      console.log(jumin);
    </script>
  </body>
</html>
<!--
변수는 어떤 값을담는 그릇
보통 변수앞에 let을 선언함
변수는 한개의 자료만 담을 수 있음
변수에 a라는 데이터가 담겼는데
새로운 데이터 b를 넣으면 a는 지워지고 b가 변수에 남음

변수 : 데이터를 저장하는 공간
변수 선언할때는
let : 변하는 데이터를 저장할 때 사용. let을 이용해서 같은 변수를 또 만들 수 없음
const : 고유한 데이터를 저장할 때 사용. 변하지 않는 데이터를 변수에 저장할 때 사용.
ex)주민번호, 생년월일, 바뀌지 않는 값
var : 예전방식, 변수앞에 선언을 하지 않으면 var로 인식함, 반복을 할 수 있음

변수명을 만들 땐
첫글자는 영어, 특수문자는 (_또는 $ )를 사용할 수 있음
대소문자 구분함.
띄어쓰기 사용못함
예약어 사용할 수 없음(let, for, if, 명령어는 예약어로 쓸 수 없음)

변수명을 만들 때는
카멜표기법 : userAge
파스칼표기법 : UserAge
언더스코어표기법 : user_age
-->

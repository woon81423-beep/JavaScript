<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      //   console.log(Math.floor(1.2));
      //   console.log(Math.floor(3.78))

      let num = Math.random();
      console.log(num); //0.xx....
      console.log(Math.floor(num)); //소수점 버림
      console.log(Math.floor(num * 100 + 1));
    </script>
  </body>
</html>
<!--

*random(난수) : 임의의 숫자가 발생. 0보다는 크고 1보다는 작은 실수가 발생함
Math는 수학함수
-->
